<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>/*MAPLIBRE_CSS*/</style>
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .maplibregl-ctrl-logo { display: none !important; }
  /* Échelle et mentions légales, comme sur wifi.sncf/fr/journey : discrètes, lisibles,
     sur un voile clair qui les détache du fond. */
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { pointer-events: auto; }
  .maplibregl-ctrl-bottom-left .maplibregl-ctrl { margin: 0 0 5px 6px; }
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl { margin: 0 5px 5px 0; }
  .maplibregl-ctrl-scale {
    font: 500 8px -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3a3a3c; background: rgba(255, 255, 255, .72);
    border: 1.5px solid #3a3a3c; border-top: none; border-radius: 0 0 2px 2px;
    padding: 0 3px; line-height: 10px; box-sizing: border-box;
  }
  .maplibregl-ctrl-attrib.maplibregl-compact, .maplibregl-ctrl-attrib {
    font: 8px -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(255, 255, 255, .72); border-radius: 3px;
    padding: 1px 4px; min-height: 0; line-height: 11px; color: #3a3a3c;
  }
  .maplibregl-ctrl-attrib-button { display: none !important; }
  .maplibregl-ctrl-attrib-inner { display: block !important; }
  .maplibregl-ctrl-attrib a { color: #3a3a3c; text-decoration: none; }
  .maplibregl-ctrl-attrib a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    .maplibregl-ctrl-scale { color: #e5e5ea; border-color: #e5e5ea; background: rgba(28, 28, 30, .72); }
    .maplibregl-ctrl-attrib { background: rgba(28, 28, 30, .72); }
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color: #e5e5ea; }
  }
  .badge {
    box-sizing: border-box; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .badge svg { width: 58%; height: 58%; fill: #fff; }
  .badge:empty { border-width: 1.5px; }
  /* Légende des LGV, au-dessus de l'échelle : n'apparaît qu'une fois une LGV repérée. */
  #lgv-legend {
    position: absolute; left: 6px; bottom: 22px; z-index: 2; display: none;
    font: 500 8px -apple-system, BlinkMacSystemFont, sans-serif; color: #3a3a3c;
    background: rgba(255, 255, 255, .72); border-radius: 3px; padding: 1px 4px; line-height: 11px;
  }
  #lgv-legend i {
    display: inline-block; width: 12px; height: 3px; border-radius: 2px;
    background: #F2A900; vertical-align: middle; margin-right: 3px;
  }
  @media (prefers-color-scheme: dark) {
    #lgv-legend { color: #e5e5ea; background: rgba(28, 28, 30, .72); }
  }
</style>
<script>/*MAPLIBRE_JS*/</script>
<script>/*PMTILES_JS*/</script>
</head>
<body>
<div id="map"></div>
<div id="lgv-legend"><i></i>LGV</div>
<script>
"use strict";

// Pictogrammes des pastilles : bâtiment de gare, face avant d'un train.
const STATION = '<svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7zM5 11v7h3v-7zm5.5 0v7h3v-7zM16 11v7h3v-7zM2 20v2h20v-2z"/></svg>';
const TRAIN = '<svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 2.5 4 6v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.2l2-2h3.6l2 2H18v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-7H6V6h5zm2 0V6h5v4zm3.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>';
const PASSED = "#8e8e93";
// Un zoom ou un déplacement à la main suspend le suivi une minute.
const USER_PAUSE_MS = 60000;

const post = (message) => {
  try { window.webkit.messageHandlers.map.postMessage(message); } catch (e) {}
};

let map = null;
let loaded = false;
let pending = null;
let tint = "#7D206F";
let travelledBase = [];
let remainingBase = [];
let train = null;
let trainMarker = null;
let stopMarkers = [];
let stopsKey = "";
let framed = null;
let userMovedAt = 0;
// « overview » : train → gare d'arrivée, zoom automatique. « follow » : train au centre,
// carte fixe, zoom seul.
let mode = "overview";
let followZoom = 11;
let followPlaced = false;
try { followZoom = Number(localStorage.getItem("followZoom")) || followZoom; } catch (e) {}

// Le style du portail vise « http://localhost:8000 » : le portail réécrit ces adresses vers
// sa propre origine, on fait de même.
async function loadStyle() {
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const names = dark ? ["style-dark", "style-light"] : ["style-light"];
  for (const name of names) {
    try {
      const response = await fetch(`/karto/${name}.json`, { cache: "no-cache" });
      if (!response.ok) continue;
      const text = await response.text();
      return JSON.parse(text.replace(/https?:\/\/localhost:8000/g, location.origin));
    } catch (e) {}
  }
  // Style introuvable : fond uni, tracé et pastilles restent lisibles.
  post({ type: "style-missing" });
  return {
    version: 8, sources: {},
    layers: [{ id: "background", type: "background",
               paint: { "background-color": dark ? "#2c2c2e" : "#e9eef2" } }],
  };
}

async function start() {
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  map = new maplibregl.Map({
    container: "map",
    style: await loadStyle(),
    center: [2.35, 46.6],
    zoom: 4.5,
    attributionControl: false,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
    fadeDuration: 0,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();

  // Mêmes mentions que le portail. Le lien s'ouvre dans le navigateur (voir TrainMapView).
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 64, unit: "metric" }), "bottom-left");
  map.addControl(new maplibregl.AttributionControl({
    compact: false,
    customAttribution: [
      "© TesmoMaps",
      '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>',
    ],
  }), "bottom-right");

  map.on("movestart", (event) => {
    // Seuls les gestes portent un événement d'origine ; les recadrages du suivi, non.
    if (event.originalEvent) userMovedAt = Date.now();
  });
  map.on("zoomend", () => {
    if (mode !== "follow") return;
    followZoom = map.getZoom();
    try { localStorage.setItem("followZoom", String(followZoom)); } catch (e) {}
    // Un zoom pendant le glissement l'interrompt à mi-course : on remet le train au centre.
    if (train) map.jumpTo({ center: train });
  });
  map.on("error", (event) => post({ type: "error", message: String(event.error && event.error.message) }));

  map.on("load", () => {
    for (const id of ["remaining", "travelled"]) {
      map.addSource(id, { type: "geojson", data: line([]) });
      map.addLayer({
        id, type: "line", source: id,
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": tint, "line-width": 4, "line-opacity": id === "travelled" ? 1 : 0.4 },
      });
    }
    // Portions sur LGV, par-dessus chacun des deux tracés.
    map.addSource("lgv-remaining", { type: "geojson", data: multiline([]) });
    map.addLayer({
      id: "lgv-remaining", type: "line", source: "lgv-remaining",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": LGV_COLOR, "line-width": 5, "line-opacity": 0.75 },
    }, "travelled");
    map.addSource("lgv-travelled", { type: "geojson", data: multiline([]) });
    map.addLayer({
      id: "lgv-travelled", type: "line", source: "lgv-travelled",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": LGV_COLOR, "line-width": 5 },
    });
    // Chaque tuile des voies ferrées chargée peut révéler de nouvelles LGV.
    map.on("sourcedata", (event) => {
      if (event.sourceId === "railways" && event.tile) scheduleLgvScan();
    });
    loaded = true;
    if (pending) update(pending);
    pending = null;
  });
  post({ type: "ready" });
}

function line(coordinates) {
  return { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates } };
}

function multiline(runs) {
  return { type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: runs } };
}

// ——— LGV ———
// La couche « speeds » des tuiles des voies ferrées du train porte la vitesse maximale de
// chaque voie (OpenStreetMap) ; le style du portail appelle LGV toute voie à plus de 220 km/h.
// Deux sources, cumulées :
// - les tuiles de zoom 8 le long de tout le tracé, lues directement dans l'archive : le
//   repérage ne dépend pas de ce qui est affiché ;
// - les tuiles affichées, plus détaillées quand on zoome.
const LGV_FILTER = [">", ["to-number", ["get", "maxspeed"]], 220];
const LGV_COLOR = "#F2A900";
const LGV_ZOOM = 8;
// Grille d'index (~2 km) et tolérance entre notre tracé et la voie d'OpenStreetMap.
const LGV_CELL = 0.02;
const LGV_TOLERANCE_M = 150;
// Un tronçon du tracé est jugé sur des points répartis le long de lui, tous les ~100 m.
const LGV_SAMPLE_M = 100;
const lgvGrid = new Map();
const lgvSeen = new Set();
const lgvSegments = new Map();
const lgvTilesDone = new Set();
let lgvArchive = null;
let lgvTimer = null;

function addLgvSegment(a, b) {
  const key = `${a[0].toFixed(5)},${a[1].toFixed(5)}|${b[0].toFixed(5)},${b[1].toFixed(5)}`;
  if (lgvSeen.has(key)) return false;
  lgvSeen.add(key);
  const x0 = Math.floor(Math.min(a[0], b[0]) / LGV_CELL), x1 = Math.floor(Math.max(a[0], b[0]) / LGV_CELL);
  const y0 = Math.floor(Math.min(a[1], b[1]) / LGV_CELL), y1 = Math.floor(Math.max(a[1], b[1]) / LGV_CELL);
  if (x1 - x0 > 50 || y1 - y0 > 50) return false;
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      const cell = `${x},${y}`;
      if (!lgvGrid.has(cell)) lgvGrid.set(cell, []);
      lgvGrid.get(cell).push([a, b]);
    }
  }
  return true;
}

// De nouvelles LGV connues : les tronçons jugés « hors LGV » sont à revoir.
function lgvChanged() {
  for (const [key, value] of lgvSegments) if (!value) lgvSegments.delete(key);
  drawLgv();
}

function scheduleLgvScan() {
  clearTimeout(lgvTimer);
  lgvTimer = setTimeout(scanLgv, 400);
}

function scanLgv() {
  if (!map.getSource("railways")) return;
  let features;
  try {
    features = map.querySourceFeatures("railways", { sourceLayer: "speeds", filter: LGV_FILTER });
  } catch (e) { return; }
  let added = 0;
  for (const feature of features) {
    const geometry = feature.geometry;
    const parts = geometry.type === "LineString" ? [geometry.coordinates]
      : geometry.type === "MultiLineString" ? geometry.coordinates : [];
    for (const part of parts) {
      for (let i = 0; i < part.length - 1; i++) if (addLgvSegment(part[i], part[i + 1])) added++;
    }
  }
  if (added) lgvChanged();
}

// — Tuiles lues dans l'archive, le long du tracé —

function tileOf(point, z) {
  const n = 2 ** z;
  const lat = point[1] * Math.PI / 180;
  const x = Math.floor((point[0] + 180) / 360 * n);
  const y = Math.floor((1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * n);
  return [Math.min(Math.max(x, 0), n - 1), Math.min(Math.max(y, 0), n - 1)];
}

async function loadLgvAlongRoute() {
  const source = map.getStyle().sources.railways;
  if (!source || !source.url) return;
  if (!lgvArchive) lgvArchive = new pmtiles.PMTiles(source.url.replace(/^pmtiles:\/\//, ""));
  const keys = new Set();
  for (const point of travelledBase.concat(remainingBase)) keys.add(tileOf(point, LGV_ZOOM).join("/"));
  let added = 0;
  for (const key of keys) {
    if (lgvTilesDone.has(key)) continue;
    lgvTilesDone.add(key);
    const [x, y] = key.split("/").map(Number);
    try {
      const response = await lgvArchive.getZxy(LGV_ZOOM, x, y);
      if (response && response.data) added += indexLgvTile(new Uint8Array(response.data), LGV_ZOOM, x, y);
    } catch (e) {
      lgvTilesDone.delete(key);
    }
  }
  if (added) lgvChanged();
}

function indexLgvTile(bytes, z, tx, ty) {
  const layer = mvtLayer(bytes, "speeds");
  if (!layer) return 0;
  const n = 2 ** z;
  const toLngLat = ([px, py]) => {
    const lng = (tx + px / layer.extent) / n * 360 - 180;
    const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (ty + py / layer.extent) / n))) * 180 / Math.PI;
    return [lng, lat];
  };
  let added = 0;
  for (const range of layer.features) {
    const feature = mvtFeature(bytes, range);
    let maxspeed = null;
    for (let i = 0; i + 1 < feature.tags.length; i += 2) {
      if (layer.keys[feature.tags[i]] === "maxspeed") maxspeed = Number(layer.values[feature.tags[i + 1]]);
    }
    if (!(maxspeed > 220) || feature.type !== 2) continue;
    for (const part of mvtLines(feature.geometry)) {
      const points = part.map(toLngLat);
      for (let i = 0; i < points.length - 1; i++) if (addLgvSegment(points[i], points[i + 1])) added++;
    }
  }
  return added;
}

// — Lecture minimale du format Mapbox Vector Tile (protobuf) —

function varint(bytes, at) {
  let result = 0, shift = 0, byte;
  do {
    byte = bytes[at.i++];
    result += (byte & 0x7f) * 2 ** shift;
    shift += 7;
  } while (byte >= 0x80);
  return result;
}

function skipField(bytes, at, wire) {
  if (wire === 0) varint(bytes, at);
  else if (wire === 1) at.i += 8;
  else if (wire === 2) { const length = varint(bytes, at); at.i += length; }
  else if (wire === 5) at.i += 4;
}

const utf8 = new TextDecoder();
function readString(bytes, at) {
  const length = varint(bytes, at);
  const text = utf8.decode(bytes.subarray(at.i, at.i + length));
  at.i += length;
  return text;
}

function packed(bytes, at) {
  const length = varint(bytes, at);
  const end = at.i + length;
  const values = [];
  while (at.i < end) values.push(varint(bytes, at));
  return values;
}

function mvtLayer(bytes, wanted) {
  const at = { i: 0 };
  while (at.i < bytes.length) {
    const tag = varint(bytes, at);
    if (tag >> 3 === 3 && (tag & 7) === 2) {
      // Longueur lue d'abord : dans « at.i + varint(…) », at.i serait lu avant d'avancer.
      const layerLength = varint(bytes, at);
      const end = at.i + layerLength;
      const layer = { name: "", keys: [], values: [], features: [], extent: 4096 };
      while (at.i < end) {
        const field = varint(bytes, at);
        const number = field >> 3, wire = field & 7;
        if (number === 1 && wire === 2) layer.name = readString(bytes, at);
        else if (number === 2 && wire === 2) {
          const length = varint(bytes, at);
          layer.features.push([at.i, at.i + length]);
          at.i += length;
        } else if (number === 3 && wire === 2) layer.keys.push(readString(bytes, at));
        else if (number === 4 && wire === 2) layer.values.push(mvtValue(bytes, at));
        else if (number === 5 && wire === 0) layer.extent = varint(bytes, at);
        else skipField(bytes, at, wire);
      }
      at.i = end;
      if (layer.name === wanted) return layer;
    } else {
      skipField(bytes, at, tag & 7);
    }
  }
  return null;
}

function mvtValue(bytes, at) {
  const length = varint(bytes, at);
  const end = at.i + length;
  let value = null;
  const view = new DataView(bytes.buffer, bytes.byteOffset);
  while (at.i < end) {
    const field = varint(bytes, at);
    const number = field >> 3, wire = field & 7;
    if (number === 1) value = readString(bytes, at);
    else if (number === 2) { value = view.getFloat32(at.i, true); at.i += 4; }
    else if (number === 3) { value = view.getFloat64(at.i, true); at.i += 8; }
    else if (number === 4 || number === 5) value = varint(bytes, at);
    else if (number === 6) { const raw = varint(bytes, at); value = raw % 2 ? -(raw + 1) / 2 : raw / 2; }
    else if (number === 7) value = varint(bytes, at) !== 0;
    else skipField(bytes, at, wire);
  }
  at.i = end;
  return value;
}

function mvtFeature(bytes, [start, end]) {
  const at = { i: start };
  const feature = { tags: [], type: 0, geometry: [] };
  while (at.i < end) {
    const field = varint(bytes, at);
    const number = field >> 3, wire = field & 7;
    if (number === 2 && wire === 2) feature.tags = packed(bytes, at);
    else if (number === 3 && wire === 0) feature.type = varint(bytes, at);
    else if (number === 4 && wire === 2) feature.geometry = packed(bytes, at);
    else skipField(bytes, at, wire);
  }
  return feature;
}

// Commandes MoveTo / LineTo, coordonnées relatives en zigzag.
function mvtLines(commands) {
  const lines = [];
  let x = 0, y = 0, current = null, i = 0;
  const zigzag = (n) => (n % 2 ? -(n + 1) / 2 : n / 2);
  while (i < commands.length) {
    const command = commands[i] & 7, count = Math.floor(commands[i] / 8);
    i++;
    if (command === 1 || command === 2) {
      for (let k = 0; k < count; k++) {
        x += zigzag(commands[i++]);
        y += zigzag(commands[i++]);
        if (command === 1) { current = []; lines.push(current); }
        current.push([x, y]);
      }
    }
  }
  return lines;
}

// — Classement du tracé —

// Distance d'un point à un segment, en mètres (plan local : suffisant à cette échelle).
function distanceToSegment(p, a, b) {
  const kx = 111320 * Math.cos(p[1] * Math.PI / 180), ky = 110540;
  const ax = (a[0] - p[0]) * kx, ay = (a[1] - p[1]) * ky;
  const bx = (b[0] - p[0]) * kx, by = (b[1] - p[1]) * ky;
  const dx = bx - ax, dy = by - ay;
  const lengthSquared = dx * dx + dy * dy;
  const t = lengthSquared > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lengthSquared)) : 0;
  return Math.hypot(ax + t * dx, ay + t * dy);
}

function nearLgv(point) {
  const cx = Math.floor(point[0] / LGV_CELL), cy = Math.floor(point[1] / LGV_CELL);
  for (let x = cx - 1; x <= cx + 1; x++) {
    for (let y = cy - 1; y <= cy + 1; y++) {
      for (const [a, b] of lgvGrid.get(`${x},${y}`) || []) {
        if (distanceToSegment(point, a, b) < LGV_TOLERANCE_M) return true;
      }
    }
  }
  return false;
}

// Un tronçon est sur LGV si au moins 60 % des points répartis le long de lui le sont : un
// tronçon long ne se juge plus sur ses deux seules extrémités.
function segmentOnLgv(a, b) {
  const key = `${a[0]},${a[1]}|${b[0]},${b[1]}`;
  if (lgvSegments.has(key)) return lgvSegments.get(key);
  const kx = 111320 * Math.cos(a[1] * Math.PI / 180), ky = 110540;
  const length = Math.hypot((b[0] - a[0]) * kx, (b[1] - a[1]) * ky);
  const samples = Math.min(40, Math.max(2, Math.ceil(length / LGV_SAMPLE_M) + 1));
  let hits = 0;
  for (let s = 0; s < samples; s++) {
    const t = s / (samples - 1);
    if (nearLgv([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t])) hits++;
  }
  const onLgv = hits / samples >= 0.6;
  // Le tronçon qui touche le train change chaque seconde : le cache ne grossit pas sans fin.
  if (lgvSegments.size > 20000) lgvSegments.clear();
  lgvSegments.set(key, onLgv);
  return onLgv;
}

// Suites de tronçons consécutifs sur LGV.
function lgvRuns(coordinates) {
  const runs = [];
  let current = null;
  for (let i = 0; i < coordinates.length - 1; i++) {
    if (segmentOnLgv(coordinates[i], coordinates[i + 1])) {
      if (!current) { current = [coordinates[i]]; runs.push(current); }
      current.push(coordinates[i + 1]);
    } else {
      current = null;
    }
  }
  return runs;
}

// Tracés prolongés jusqu'au train : le tronçon qui le touche est jugé comme les autres.
function drawLgv() {
  if (!loaded || lgvGrid.size === 0) return;
  const head = train ? [train] : [];
  const travelled = lgvRuns(travelledBase.concat(head));
  const remaining = lgvRuns(head.concat(remainingBase));
  map.getSource("lgv-travelled").setData(multiline(travelled));
  map.getSource("lgv-remaining").setData(multiline(remaining));
  document.getElementById("lgv-legend").style.display =
    travelled.length || remaining.length ? "block" : "none";
}

function badge(svg, size, color, title) {
  const element = document.createElement("div");
  element.className = "badge";
  element.style.width = element.style.height = `${size}px`;
  element.style.background = color;
  element.innerHTML = svg;
  if (title) element.title = title;
  return element;
}

// Appelée par Swift à chaque rafraîchissement. Les tracés ne sont envoyés que s'ils changent ;
// le train, lui, arrive chaque seconde et prolonge les deux tracés.
window.update = function (payload) {
  if (!loaded) { pending = Object.assign(pending || {}, payload); return; }

  if (payload.tint && payload.tint !== tint) {
    tint = payload.tint;
    for (const id of ["remaining", "travelled"]) map.setPaintProperty(id, "line-color", tint);
    stopsKey = "";
    if (trainMarker) { trainMarker.remove(); trainMarker = null; }
  }
  if (payload.travelled) travelledBase = payload.travelled;
  if (payload.remaining) remainingBase = payload.remaining;
  train = payload.train || null;

  const head = train ? [train] : [];
  map.getSource("travelled").setData(line(travelledBase.concat(head)));
  map.getSource("remaining").setData(line(head.concat(remainingBase)));
  if (payload.travelled || payload.remaining) loadLgvAlongRoute();
  drawLgv();

  if (payload.stopsKey !== undefined && payload.stopsKey !== stopsKey) {
    stopsKey = payload.stopsKey;
    stopMarkers.forEach((marker) => marker.remove());
    stopMarkers = payload.stops.map((stop) => {
      // Mes gares de départ et d'arrivée un peu plus grandes ; les autres, discrètes.
      const size = stop.arrival ? 18 : (stop.status === "passed" ? 10 : 13);
      const color = stop.status === "passed" ? PASSED : tint;
      // Pictogramme sur mes deux gares seulement : les autres restent de simples points.
      return new maplibregl.Marker({ element: badge(stop.arrival ? STATION : "", size, color, stop.label) })
        .setLngLat(stop.c).addTo(map);
    });
  }

  if (train) {
    if (!trainMarker) {
      const element = badge(TRAIN, 30, tint);
      element.style.zIndex = "2";
      trainMarker = new maplibregl.Marker({ element }).setLngLat(train).addTo(map);
    } else {
      trainMarker.setLngLat(train);
    }
  } else if (trainMarker) {
    trainMarker.remove();
    trainMarker = null;
  }

  if (payload.mode) applyMode(payload.mode);
  if (mode === "follow") {
    center();
  } else if (payload.bounds) {
    follow(payload.bounds);
  }
};

// Suivi : ni déplacement ni zoom ailleurs qu'au centre, où se tient le train.
function applyMode(next) {
  if (next === mode) return;
  mode = next;
  if (mode === "follow") {
    map.dragPan.disable();
    map.boxZoom.disable();
    map.doubleClickZoom.disable();
    map.keyboard.disable();
    map.scrollZoom.enable({ around: "center" });
    map.touchZoomRotate.enable({ around: "center" });
    followPlaced = false;
  } else {
    map.dragPan.enable();
    map.boxZoom.enable();
    map.doubleClickZoom.enable();
    map.keyboard.enable();
    map.scrollZoom.enable();
    map.touchZoomRotate.enable();
    // Retour au cadrage train → gare d'arrivée, sans attendre la fin d'une pause.
    framed = null;
    userMovedAt = 0;
  }
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
}

// Garde le train au centre. Glissement linéaire d'une seconde, au rythme des positions :
// la carte défile en continu sous le train.
function center() {
  if (!train) return;
  if (!followPlaced) {
    followPlaced = true;
    map.jumpTo({ center: train, zoom: followZoom });
    return;
  }
  const here = map.project(map.getCenter());
  const there = map.project(train);
  if (Math.hypot(here.x - there.x, here.y - there.y) < 0.5) return;
  map.easeTo({ center: train, duration: 1000, easing: (t) => t });
}

// Cadre train → gare d'arrivée, sauf pendant la pause qui suit un geste. Un écart de moins de
// 5 % du cadre ne vaut pas de bouger la carte.
function follow(bounds) {
  if (Date.now() - userMovedAt < USER_PAUSE_MS) return;
  if (framed && isClose(framed, bounds)) return;
  const animate = framed !== null;
  framed = bounds;
  // Marge du bas plus large : l'échelle et les mentions y sont.
  map.fitBounds(bounds, { padding: { top: 26, left: 26, right: 26, bottom: 36 }, duration: animate ? 800 : 0 });
}

function isClose(a, b) {
  const size = Math.max(a[1][0] - a[0][0], a[1][1] - a[0][1], 1e-6);
  const tolerance = 0.05 * size;
  return [0, 1].every((corner) => [0, 1].every((axis) =>
    Math.abs(a[corner][axis] - b[corner][axis]) < tolerance));
}

start().catch((error) => post({ type: "error", message: String(error) }));
</script>
