name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Un push qui ne touche que la documentation ne publie pas de release : ses commits
    # figureront dans le changelog de la suivante. Sans effet sur les tags.
    paths-ignore:
      - "**.md"
      - "img/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

# Deux pushes rapprochés calculeraient le même numéro de version : on sérialise.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le changelog se calcule sur l'historique et les tags : pas de clone superficiel.
          fetch-depth: 0

      - name: Calculer la version
        id: version
        run: |
          set -euo pipefail
          previous="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n1 || true)"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            # Sur un tag, le précédent est celui d'avant — pas le tag qu'on publie.
            previous="$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -v "^${version}$" | head -n1 || true)"
          else
            # Pas encore de tag versionné : on repart de la version du bundle.
            base="${previous:-v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)}"
            IFS=. read -r major minor patch <<< "${base#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi

          # Premier passage au versionnage : le point de départ du changelog est la
          # release roulante « latest », dernier état publié.
          if [ -z "$previous" ] && git rev-parse -q --verify refs/tags/latest >/dev/null; then
            previous="latest"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          # Pas d'apostrophe dans un ${...:-défaut} : bash y voit une quote ouvrante.
          echo "Version : $version — changelog depuis ${previous:-le premier commit}"

      - name: Estampiller la version dans le bundle
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build SNCFWifi.app
        run: ./build.sh

      - name: Package app
        run: zip -r SNCFWifi.zip SNCFWifi.app

      # Seuls `main` et les tags `v*` publient une release. Un build lancé à la main depuis une
      # autre branche est un build de test : le zip part en artefact du run, sans tag ni
      # release à nettoyer ensuite.
      - name: Déposer le build de test
        if: github.ref != 'refs/heads/main' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: SNCFWifi-test-${{ github.run_number }}  # pas de ref_name : « / » interdit
          path: SNCFWifi.zip
          retention-days: 14

      - name: Rédiger le changelog
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 scripts/release_notes.py > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publier la release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: SNCFWifi.zip
          make_latest: true
