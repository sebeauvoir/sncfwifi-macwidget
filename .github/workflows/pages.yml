name: Version web

# Publie `web/` sur GitHub Pages à chaque push sur `main` qui la touche. Prérequis, une seule
# fois : Settings → Pages → Source « GitHub Actions ».
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe
        run: for f in web/*.js; do node --check "$f"; done

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Déposer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
